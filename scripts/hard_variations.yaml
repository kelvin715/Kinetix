# Configuration for generating grasp_hard level variations
# Varies x position of blue circle and green square + podium
# Optionally varies y position of green square (above podium)

input_json: "l/grasp_hard.json"
output_dir: "outputs/hard_level_variants"
num_variants: 100
seed: 42

# Margin from screen edges (in world units)
x_margin: 0.3
y_margin: 0.3

# Minimum separation between blue circle and green+podium (in world units)
min_separation: 0.5

# Whether to vary green box x independently from podium x (all 3 objects vary independently)
# When false (default), green box and podium share the same x position
independent_green_x: true

# Whether to also vary the y position of the green box (podium y stays fixed)
vary_green_y: true

# Green box y position constraints (when vary_green_y is true)
green_y_min_above_podium: 0.1 # Minimum distance above podium top
green_y_max_offset: 0.8 # Maximum y offset range from minimum (keep close to podium)
green_y_max_visible: 2.5 # Hard cap on y position to stay within visible screen
